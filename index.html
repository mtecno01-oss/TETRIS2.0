<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#05050a">
    <title>Cyber Tetris Neon 2.0</title>
    <!-- Google Fonts: Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <header class="game-header">
        <h1>CYBER TETRIS <span class="version-tag">2.0</span></h1>
        <div class="header-actions">
            <button class="icon-btn" id="sound-btn" aria-label="Alternar sonido" title="Sonido (M)">🔊</button>
        </div>
    </header>

    <main class="container">

        <!-- PANEL IZQUIERDO (HOLD) -->
        <aside class="side-panel left-panel">
            <div class="panel-box">
                <h2>HOLD <span class="key-tag">[C]</span></h2>
                <div id="hold-canvas"></div>
            </div>

            <div class="panel-box">
                <h2>RECORD</h2>
                <p id="high-score">0</p>
            </div>

            <div class="panel-box">
                <h2>LÍNEAS</h2>
                <p id="lines">0</p>
            </div>
        </aside>

        <!-- ÁREA CENTRAL DEL TABLERO -->
        <div class="game-area">

            <div class="board-wrap" id="board-wrap">
                <div class="game-board" id="board"></div>

                <!-- NOTIFICACIÓN FLOTANTE (TETRIS, COMBO, LEVEL UP) -->
                <div id="toast-banner" class="toast-banner"></div>

                <!-- OVERLAY DE PAUSA -->
                <div id="pause-overlay" class="pause-overlay">
                    <h2>PAUSED</h2>
                    <p>Presioná CONTINUAR o [P] para seguir</p>
                    <button class="btn-neon" onclick="togglePause()">CONTINUAR</button>
                </div>

                <!-- OVERLAY DE GAME OVER -->
                <div id="game-over" class="game-over-overlay">
                    <h2 class="glitch-text">SYSTEM FAIL</h2>
                    <div class="game-over-stats">
                        <div class="stat-row"><span>SCORE:</span> <b id="final-score">0</b></div>
                        <div class="stat-row"><span>RECORD:</span> <b id="final-high-score">0</b></div>
                        <div class="stat-row"><span>LÍNEAS:</span> <b id="final-lines">0</b></div>
                        <div class="stat-row"><span>NIVEL:</span> <b id="final-level">1</b></div>
                        <div id="new-record-badge" class="new-record-badge">★ NUEVO RECORD ★</div>
                    </div>
                    <button class="btn-neon restart-btn" onclick="restartGame()">RESTART SYSTEM</button>
                </div>
            </div>

            <!-- CONTROLES TÁCTILES MEJORADOS -->
            <div class="touch-controls" aria-label="Controles táctiles">

                <div class="control-row">
                    <button class="control-btn control-wide" id="hold-btn" aria-label="Guardar pieza">
                        📦 HOLD
                    </button>
                    <button class="control-btn control-wide" id="rotate-btn" aria-label="Rotar pieza">
                        ↻ ROTAR
                    </button>
                </div>

                <div class="control-row">
                    <button class="control-btn" id="left-btn" aria-label="Mover izquierda">←</button>
                    <button class="control-btn" id="down-btn" aria-label="Bajar suave">↓</button>
                    <button class="control-btn" id="right-btn" aria-label="Mover derecha">→</button>
                </div>

                <div class="control-row action-row">
                    <button class="control-btn control-wide hard-drop-btn" id="hard-btn" aria-label="Caída instantánea">
                        ⤓ CAÍDA
                    </button>
                    <button class="btn-neon pause-touch-btn" id="pause-touch-btn" aria-label="Pausa">
                        ⏸ PAUSA
                    </button>
                </div>

            </div>
        </div>

        <!-- PANEL DERECHO (NEXT, SCORE, LEVEL, CONTROLES) -->
        <aside class="side-panel right-panel">

            <div class="panel-box">
                <h2>NEXT</h2>
                <div id="next-canvas"></div>
            </div>

            <div class="panel-box">
                <h2>SCORE</h2>
                <p id="score">0</p>
            </div>

            <div class="panel-box">
                <h2>NIVEL</h2>
                <p id="level">1</p>
            </div>

            <button class="btn-neon" id="start-btn" onclick="startGame()">
                START
            </button>

            <button class="btn-neon pause-side-btn" id="pause-btn" onclick="togglePause()">
                ⏸ PAUSA
            </button>

        </aside>

    </main>

    <footer class="controls-hint">
        PC: ← → / A D MOVER | ↑ / W ROTAR | ↓ / S BAJAR | ESPACIO CAÍDA | C / SHIFT HOLD | P PAUSA | M SONIDO
    </footer>

    <script src="scripts.js"></script>

</body>

</html>
